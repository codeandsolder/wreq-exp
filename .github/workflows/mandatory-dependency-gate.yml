name: Mandatory dependency consolidation
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  dependency-gate:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-dependency-gate.yml@1293f1c247f07a14a85859f908b4f6b7e2553922 # main
    with:
      working-directories: '["."]'
