name: Mandatory dependency consolidation
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  dependency-gate:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-dependency-gate.yml@97a50dd3304be8cf19738aa1c027ac4ecd1f3d2b # main
    with:
      working-directories: '["."]'
