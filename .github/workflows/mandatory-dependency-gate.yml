name: Mandatory dependency consolidation
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  dependency-gate:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-dependency-gate.yml@5635824a189d1a1d80b2834a08f8b8fbb9452186 # main
    with:
      working-directories: '["."]'
