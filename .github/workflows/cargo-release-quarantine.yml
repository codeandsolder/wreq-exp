name: Cargo release-age quarantine

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quarantine:
    uses: codeandsolder/ci-workflows/.github/workflows/cargo-release-quarantine.yml@5635824a189d1a1d80b2834a08f8b8fbb9452186 # main
