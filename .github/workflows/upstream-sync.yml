name: Follow upstream

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main
    with:
      upstream-repository: 0x676e67/wreq
      upstream-branch: main
      target-branch: main
      strategy: source-merge
      rust-toolchain: repository
      go: true
      validation-script: .github/scripts/validate-upstream.sh
      timeout-minutes: 60
