name: Follow upstream

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@ecf97ef6708aaba39d6afad83bb82ebcca84723a # main
    with:
      upstream-repository: 0x676e67/wreq
      upstream-branch: main
      target-branch: main
      strategy: source-merge
      rust-toolchain: "1.99.0"
      nightly-format: true
      go: true
      validation-script: .github/scripts/validate-upstream.sh
      timeout-minutes: 60
