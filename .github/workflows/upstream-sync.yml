name: Follow upstream

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@97a50dd3304be8cf19738aa1c027ac4ecd1f3d2b # main
    with:
      upstream-repository: 0x676e67/wreq
      upstream-branch: main
      target-branch: main
      workflow-policy: preserve
      rust-toolchain: repository
      go: true
      validation-script: .github/scripts/validate-upstream.sh
      timeout-minutes: 60
