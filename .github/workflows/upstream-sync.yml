name: Follow upstream

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@f0267b6ece698276d68775f04293665f5b7e32c7 # main
    with:
      upstream-repository: 0x676e67/wreq
      upstream-branch: main
      target-branch: main
      workflow-policy: preserve
      rust-toolchain: "1.99.0"
      nightly-format: true
      go: true
      validation-script: .github/scripts/validate-upstream.sh
      timeout-minutes: 60
