name: Release-plz

on:
  push:
    branches:
      - main
      - "0.16.x"

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == '0x676e67' }}
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
    permissions:
      contents: write
      # release-plz exchanges this OIDC token for a crates.io publish token.
      id-token: write
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@5635824a189d1a1d80b2834a08f8b8fbb9452186 # main

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@5635824a189d1a1d80b2834a08f8b8fbb9452186 # main

  release-plz-pr:
    name: Release-plz PR
    needs: release-plz-release
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.repository_owner == '0x676e67' &&
        needs.release-plz-release.result == 'success' &&
        needs.release-plz-release.outputs.releases_created == 'false'
      }}
    permissions:
      pull-requests: write
      contents: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *install-rust
      - name: Configure the 0.16.3 compatibility exception
        id: release-config
        if: ${{ github.ref == 'refs/heads/0.16.x' }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          package = tomllib.loads(Path("Cargo.toml").read_text())["package"]
          if package["name"] == "wreq" and package["version"] == "0.16.2":
              # Remove only the accidentally exposed runtime APIs in this patch release.
              # The exception expires once the release PR sets the version to 0.16.3.
              config = Path(os.environ["RUNNER_TEMP"]) / "release-plz-0.16.3.toml"
              config.write_text(
                  Path(".release-plz.toml").read_text()
                  + '\n[[package]]\nname = "wreq"\nsemver_check = false\n'
              )
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"path={config}\n")
          PY
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@5635824a189d1a1d80b2834a08f8b8fbb9452186 # main

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          config: ${{ steps.release-config.outputs.path || '.release-plz.toml' }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@5635824a189d1a1d80b2834a08f8b8fbb9452186 # main
