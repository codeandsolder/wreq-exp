name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    name: Quick gate (Rust 1.98.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format fork package
        run: cargo +nightly fmt -p wreq -- --check
      - name: Clippy default library
        run: cargo +1.98.1 clippy --locked -p wreq --lib -- -D warnings
      - name: Test default library
        run: cargo +1.98.1 test --locked -p wreq --lib

  full-style:
    name: Full style / feature lint
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Clippy all targets and features
        run: cargo +1.98.1 clippy --locked -p wreq --all-targets --all-features -- -D warnings

  docs:
    name: Docs
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo +1.98.1 doc --locked -p wreq --document-private-items --all-features

  test:
    name: Test (${{ matrix.feature-set }})
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        feature-set:
          - ""
          - "--features compio-rt"
          - "--all-features"
          - "--features form"
          - "--features query"
          - "--features cookies"
          - "--features gzip,stream"
          - "--features brotli,stream"
          - "--features zstd,stream"
          - "--features deflate,stream"
          - "--features json"
          - "--features multipart"
          - "--features stream"
          - "--features hickory-dns"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v7
        if: matrix.feature-set == '--all-features'
        with:
          go-version: stable
          cache: false
      - uses: taiki-e/install-action@v2.87.17
        with:
          tool: cargo-nextest
      - name: Run tests (${{ matrix.feature-set }})
        run: cargo +1.98.1 nextest run -p wreq ${{ matrix.feature-set }}

  build:
    name: Build (${{ matrix.env }})
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.env }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            env: Linux
          - os: windows-latest
            env: Windows
          - os: macos-latest
            env: macOS
          - os: ubuntu-latest
            env: Android
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install NASM (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install nasm -y
      - name: Build
        if: matrix.env != 'Android'
        run: cargo +1.98.1 build --locked -p wreq --all-features
      - name: Add Android targets
        if: matrix.env == 'Android'
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - uses: nttld/setup-ndk@v1.6.0
        if: matrix.env == 'Android'
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true
      - name: Build with cargo-ndk
        if: matrix.env == 'Android'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk
          cargo +1.98.1 ndk -t arm64-v8a -t x86_64 build -p wreq --all-features
