name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    name: Quick gate (native nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve native quarantined Rust
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "${{ steps.compiler.outputs.channel }}"
          components: clippy,rustfmt
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main
        with:
          rust-toolchain: "${{ steps.compiler.outputs.channel }}"

      - name: Format fork package
        run: cargo fmt -p wreq -- --check
      - name: Clippy default library
        run: cargo clippy --locked -p wreq --lib -- -D warnings
      - name: Test default library
        run: cargo test --locked -p wreq --lib

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main

  full-style:
    name: Full style / feature lint
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve native quarantined Rust
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "${{ steps.compiler.outputs.channel }}"
          components: clippy,rustfmt
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main
        with:
          rust-toolchain: "${{ steps.compiler.outputs.channel }}"

      - name: Clippy all targets and features
        run: cargo clippy --locked -p wreq --all-targets --all-features -- -D warnings
      # Reuse the same runner, compiler setup, and incremental target for the
      # ordinary PR build and docs instead of provisioning two more runners.
      - name: Build all features (PR)
        if: github.event_name == 'pull_request'
        run: cargo build --locked -p wreq --all-features
      - name: Build documentation (PR)
        if: github.event_name == 'pull_request'
        run: cargo doc --locked -p wreq --document-private-items --all-features

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main

  emulation-profiles:
    name: Patched browser profile compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve native quarantined Rust
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "${{ steps.compiler.outputs.channel }}"
          components: clippy,rustfmt
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main
        with:
          rust-toolchain: "${{ steps.compiler.outputs.channel }}"

      - name: Verify browser profiles against current Wreq TLS/H2 APIs
        run: |
          profiles=$(mktemp -d)
          trap 'rm -rf "$profiles"' EXIT
          git clone --quiet --depth 1 --branch wreq-util-v0.0.1 https://github.com/codeandsolder/cargo-patches.git "$profiles"
          cargo --config "patch.\"https://github.com/codeandsolder/wreq-exp.git\".wreq.path = \"$GITHUB_WORKSPACE\"" test --manifest-path "$profiles/wreq-util/Cargo.toml" --features tokio-rt --test profile_wire_compat

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main

  docs:
    name: Docs
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve native quarantined Rust
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "${{ steps.compiler.outputs.channel }}"
          components: clippy,rustfmt
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main
        with:
          rust-toolchain: "${{ steps.compiler.outputs.channel }}"

      - name: Build docs
        run: cargo doc --locked -p wreq --document-private-items --all-features

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main

  test:
    name: Test feature group (${{ matrix.group }})
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      # Reuse each runner's Cargo build artifacts for five feature variants.
      # All 15 prior test configurations remain covered.
      matrix:
        include:
          - group: runtime
            feature-sets: |
              default
              --no-default-features --features tokio-rt,webpki-roots
              --features compio-rt
              --all-features
              --features hickory-dns
          - group: request
            feature-sets: |
              --features form
              --features query
              --features cookies
              --features json
              --features multipart
          - group: compression
            feature-sets: |
              --features gzip,stream
              --features brotli,stream
              --features zstd,stream
              --features deflate,stream
              --features stream
    steps:
      - uses: actions/checkout@v7
      - name: Resolve native quarantined Rust
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "${{ steps.compiler.outputs.channel }}"
          components: clippy,rustfmt
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main
        with:
          rust-toolchain: "${{ steps.compiler.outputs.channel }}"

      - uses: actions/setup-go@v7
        if: matrix.group == 'runtime'
        with:
          go-version: stable
          cache: false
      - uses: taiki-e/install-action@v2.87.17
        with:
          tool: cargo-nextest
      - name: Run tests (${{ matrix.group }})
        shell: bash
        env:
          FEATURE_SETS: ${{ matrix.feature-sets }}
        run: |
          while IFS= read -r flags; do
            # Nextest has no --default-features flag; omitting a feature
            # selector is its default-feature configuration.
            if [[ "$flags" == default ]]; then
              feature_args=()
            else
              read -r -a feature_args <<< "$flags"
            fi
            echo "::group::nextest $flags"
            cargo nextest run -p wreq --locked "${feature_args[@]}"
            echo "::endgroup::"
          done <<< "$FEATURE_SETS"

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main

  build:
    name: Build (${{ matrix.env }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.env }}
    strategy:
      matrix:
        include: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '[{"os":"ubuntu-latest","env":"Linux"},{"os":"windows-latest","env":"Windows"},{"os":"macos-latest","env":"macOS"},{"os":"ubuntu-latest","env":"Android"}]' || '[{"os":"ubuntu-latest","env":"Linux"}]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve native quarantined Rust
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "${{ steps.compiler.outputs.channel }}"
          components: clippy,rustfmt
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main
        with:
          rust-toolchain: "${{ steps.compiler.outputs.channel }}"

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install NASM (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install nasm -y
      - name: Build
        if: matrix.env != 'Android'
        run: cargo build --locked -p wreq --all-features
      - name: Add Android targets
        if: matrix.env == 'Android'
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - uses: nttld/setup-ndk@v1.6.0
        if: matrix.env == 'Android'
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true
      - name: Build with cargo-ndk
        if: matrix.env == 'Android'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t x86_64 build -p wreq --all-features

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main
